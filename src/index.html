<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rust Mail Client</title>

  <link rel="stylesheet" href="dist/bootstrap.min.css" />
  <script src="dist/bootstrap.bundle.min.js"></script>
  <script src="dist/purify.min.js"></script>

  <link rel="stylesheet" href="main.css" />
  <script type="module" src="main.js"></script>
</head>

<body>
  <div id="list-view">
    <div id="mail-searchbar">
      <svg id="mail-searchbar-icon" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 101 101">
        <path

        </path>
      </svg>
      <input id="mail-searchbar-input" class="form-control m-2" type="search" placeholder="Search..."
        aria-label="Search" autocomplete="off" />

    <div id="maillist">
      <!-- mails added by javascript -->
    </div>
  </div>

  <div id="detail-view">
    <!-- mails added by javascript -->
  </div>
</body>

</html>
